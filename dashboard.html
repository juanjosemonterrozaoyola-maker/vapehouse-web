<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VapeHouse — Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", sans-serif; background: #0B1120; color: #F0F4FF; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #111827; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3B82F6; }
        .header .brand { font-size: 24px; font-weight: bold; color: #F0F4FF; }
        .header .brand span { color: #7A8BA8; font-size: 11px; display: block; font-weight: normal; }
        .btn-volver { background: #1E293B; color: #7A8BA8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 600px; margin: 40px auto; padding: 0 24px; width: 100%; }
        .menu-card { background: #1C2537; border: 1px solid #1E3050; border-radius: 12px; padding: 28px 20px; text-align: center; cursor: pointer; border-top: 4px solid var(--accent); transition: transform 0.2s; }
        .menu-card:hover { transform: translateY(-2px); }
        .menu-card .icon { font-size: 36px; margin-bottom: 10px; }
        .menu-card .title { font-size: 16px; font-weight: bold; color: #F0F4FF; margin-bottom: 4px; }
        .menu-card .desc { font-size: 12px; color: #7A8BA8; }
        .menu-card .btn-abrir { display: inline-block; margin-top: 14px; padding: 8px 20px; background: transparent; color: #A8B8D0; border: 1px solid #1E3050; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .footer { margin-top: auto; padding: 12px 28px; text-align: center; color: #7A8BA8; font-size: 11px; background: #111827; border-top: 1px solid #1E3050; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">VAPEHOUSE <span>SISTEMA DE GESTIÓN EMPRESARIAL</span></div>
        <button class="btn-volver" onclick="window.location.href='/'">Cerrar Sesión</button>
    </div>

    <div class="menu-grid">
        <div class="menu-card" style="--accent: #10B981" onclick="window.location.href='/inventario.html'">
            <div class="icon">📦</div>
            <div class="title">Inventario</div>
            <div class="desc">Stock y productos</div>
            <div class="btn-abrir">Abrir →</div>
        </div>
        <div class="menu-card" style="--accent: #3B82F6" onclick="window.location.href='/contabilidad.html'">
            <div class="icon">📊</div>
            <div class="title">Contabilidad</div>
            <div class="desc">Reportes de ventas</div>
            <div class="btn-abrir">Abrir →</div>
        </div>
        <div class="menu-card" style="--accent: #F59E0B" onclick="window.location.href='/gastos.html'">
            <div class="icon">💰</div>
            <div class="title">Gasto / Ganancia</div>
            <div class="desc">Control financiero</div>
            <div class="btn-abrir">Abrir →</div>
        </div>
        <div class="menu-card" style="--accent: #8B5CF6" onclick="window.location.href='/analisis_bi.html'">
            <div class="icon">🧠</div>
            <div class="title">Análisis BI</div>
            <div class="desc">Inteligencia de negocios</div>
            <div class="btn-abrir">Abrir →</div>
        </div>
    </div>

    <div class="footer">VapeHouse v2.0 — Sistema Empresarial</div>
</body>
</html>
